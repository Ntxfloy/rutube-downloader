name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Тесты (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Системные зависимости (виртуальный дисплей для Tk)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb

      - name: Зависимости Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Проверка синтаксиса
        run: python -m compileall -q core gui tests main.py

      - name: Линтер (информативно)
        continue-on-error: true
        run: ruff check core gui tests

      - name: Тесты
        run: xvfb-run -a python -m pytest -q
