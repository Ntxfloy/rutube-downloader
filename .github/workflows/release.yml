name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Версия для релиза (без v, например 1.3)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Сборка и публикация релиза
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Проверка кода
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Настройка Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pyinstaller

      - name: Запуск тестов
        run: |
          python -m pytest -q

      - name: Сборка EXE с PyInstaller
        run: |
          cd build_exe
          python -m PyInstaller --noconfirm --distpath ./build_exe --workpath ./build_exe/build RutubeDownloader.spec

      - name: Определение версии и тега
        id: prep
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
              $ver = "${{ inputs.version }}".TrimStart('v')
              $tag = "v$ver"
          } else {
              $tag = "${{ github.ref_name }}"
              $ver = $tag.TrimStart('v')
          }
          Write-Output "TAG_NAME=$tag" >> $env:GITHUB_ENV
          Write-Output "VERSION=$ver" >> $env:GITHUB_ENV

      - name: Проверка существования релиза
        id: check_release
        shell: powershell
        run: |
          $tag = $env:TAG_NAME
          $exists = gh release view $tag 2>&1
          if ($LASTEXITCODE -eq 0) {
              Write-Error "Релиз с тегом $tag уже существует! Прерывание во избежание дублирования."
              exit 1
          } else {
              Write-Host "Релиз $tag еще не создан. Продолжаем."
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Публикация релиза на GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Rutube Downloader v${{ env.VERSION }}
          draft: false
          prerelease: false
          files: |
            build_exe/build_exe/RutubeDownloader.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
